# =====================================================================
# cora.cfg -- openocd for the Cora Z7-07S
#
# The board carries an FT2232HQ (0403:6010) wired the way every Digilent
# 7-series board is: channel A is JTAG, channel B is the USB-UART. That
# is why the board enumerates as two ttyUSB nodes and only ttyUSB1 is a
# terminal.
#
# WHY THE TAPS ARE DECLARED HERE INSTEAD OF SOURCING zynq_7000.cfg
#
# openocd 0.12.0 ships a Zynq target config that lists four acceptable
# PL IDCODEs, and the XC7Z007S is not among them. Measured on this
# board:
#
#   zynq_pl.bs   0x13723093     part 0x3723 = XC7Z007S, revision 1
#   zynq.cpu     0x4ba00477     ARM DAP, matches the stock config
#
# Sourcing the stock file gets you "UNEXPECTED", four "expected N of 4"
# errors, and -- the part that actually matters -- "Bypassing JTAG setup
# events due to errors". It limps on, but with setup events skipped. The
# device is right; the vendor's table is incomplete. So the chain is
# declared here with the correct ID, and the rest of the stock config is
# reproduced verbatim below.
#
# The 7Z007S ids are listed first, then the four from the stock config,
# so this file still works unmodified on a 7Z010/7Z020 board.
# =====================================================================

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# Channel A. Channel B is the console and must be left alone -- claiming
# it here is what makes the UART vanish mid-session.
ftdi channel 0
ftdi layout_init 0x0088 0x008b

set _CHIPNAME zynq
set _TARGETNAME $_CHIPNAME.cpu

jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 \
    -expected-id 0x13723093 \
    -expected-id 0x03723093 \
    -expected-id 0x23727093 \
    -expected-id 0x13722093 \
    -expected-id 0x03727093 \
    -expected-id 0x03736093

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x4ba00477

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create ${_TARGETNAME}0 cortex_a -dap $_CHIPNAME.dap \
    -coreid 0 -dbgbase 0x80090000
target create ${_TARGETNAME}1 cortex_a -dap $_CHIPNAME.dap \
    -coreid 1 -dbgbase 0x80092000

# The stock config groups these two with `target smp`, and that is wrong
# for this job in a way that bites quietly: with an SMP group, `halt` and
# `resume` act on the group, and the LAST target created is the default
# selection -- so an unqualified `halt` drives cpu1. Everything here is
# single-core bare metal on cpu0. No group; the load sequence names cpu0
# explicitly.
${_TARGETNAME}0 configure -event reset-assert-post "cortex_a dbginit"
${_TARGETNAME}1 configure -event reset-assert-post "cortex_a dbginit"

# There is no SRST. Digilent does not wire the FT2232's reset to the PS
# on this board, so `reset halt` fails with "how to reset?". Saying so up
# front turns a confusing error into a known constraint.
#
# Nothing is lost by it: crt0.S already puts the core into a known state
# from wherever it is found -- SVC mode, interrupts masked, MMU and
# caches off, VBAR pointed at our table. That was written because a
# bare-metal image cannot assume its predecessor was tidy, and it happens
# to be exactly what a missing reset line requires.
reset_config none separate

pld device virtex2 zynq_pl.bs 1

set XC7_JSHUTDOWN 0x0d
set XC7_JPROGRAM 0x0b
set XC7_JSTART 0x0c
set XC7_BYPASS 0x3f

proc zynqpl_program {tap} {
	global XC7_JSHUTDOWN XC7_JPROGRAM XC7_JSTART XC7_BYPASS
	irscan $tap $XC7_JSHUTDOWN
	irscan $tap $XC7_JPROGRAM
	runtest 60000
	#JSTART prevents this from working...
	#irscan $tap $XC7_JSTART
	runtest 2000
	irscan $tap $XC7_BYPASS
	runtest 2000
}

# Set last: the stock target config forces 1000 kHz, and sourcing it
# would silently undo anything chosen earlier. 5 MHz is well within what
# the FT2232H and the board's buffers manage, and bring-up is not the
# place to discover that a marginal clock looks like a datapath fault.
adapter speed 5000

# The PS is brought up by the application itself -- crt0.S calls
# ps7_init() and ps7_post_config() out of the XSA -- so there is
# deliberately no ps7_init.tcl sourced here. One bring-up path, in one
# place, identical whether the code is started from openocd or a reset.
